name: Invariants — migrations & RLS

# Structural invariants the build must never violate (gap G9). Both classes have already
# bitten: a duplicate Alembic revision id survived seven commits + a merge (broke the prod
# migration), and item_validations shipped without Row-Level Security (caught by an external
# advisor, not the build). This job makes "the system cannot tell you something is missing"
# tell you.
#   1. Exactly ONE Alembic head (pure — reads migration files, no DB).
#   2. Every public Postgres table has RLS enabled (needs the DATABASE_URL secret).

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch: {}

jobs:
  invariants:
    name: single head + RLS on every public table
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install minimal deps
        run: |
          python -m pip install --upgrade pip
          pip install "alembic>=1.13" sqlmodel psycopg2-binary

      - name: Exactly one Alembic head
        run: |
          python - <<'PY'
          from alembic.config import Config
          from alembic.script import ScriptDirectory
          heads = ScriptDirectory.from_config(Config("alembic.ini")).get_heads()
          if len(heads) != 1:
              raise SystemExit(f"::error::Expected 1 Alembic head, found {len(heads)}: {heads}")
          print(f"OK — single head: {heads[0]}")
          PY

      - name: RLS enabled on every public table
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "::error::DATABASE_URL secret is not set — cannot verify RLS."
            exit 1
          fi
          python - <<'PY'
          import os
          import psycopg2
          conn = psycopg2.connect(os.environ["DATABASE_URL"])
          cur = conn.cursor()
          cur.execute("SELECT tablename FROM pg_tables WHERE schemaname='public' AND rowsecurity=false ORDER BY tablename")
          exposed = [r[0] for r in cur.fetchall()]
          if exposed:
              raise SystemExit("::error::Public tables WITHOUT Row-Level Security: " + ", ".join(exposed) + " — enable RLS (see docs / §9.3).")
          print("OK — RLS enabled on every public table.")
          PY
